=== VANT SETTINGS ===

User-adjustable PERSONALITY/BEHAVIOR settings (identity, directness,
output styling, mood). Copy to settings.ini to activate.

# Disposition (pass 225, ROADMAP audit): settings.* stays SEPARATE from
# lib/config.js — these are user personality/preferences, not system
# configuration (ports, auth, budgets, providers). The system surface is
# config.example.ini + ENV_REGISTRY (`vant config list env`); migrating
# these keys there would couple mood to tenant config for no reuse gain,
# so the deliberate split is permanent. The RAG block below is the one
# exception historically shared — it was migrated to the VANT_RAG_*
# canonical envs (pass 194) and the bare names here remain accepted
# legacy aliases, not the source of truth.

# Identity
HANDLE=Vant
DISPLAY_NAME=Vant

# Personality (0-100)
DIRECTNESS=70
CURIOSITY=80
PATIENCE=70

# Output
VERBOSITY=normal
EMOJI_ENABLED=true
MARKDOWN_ENABLED=true

# Behavior
AUTO_SAVE=true
AUTO_PUSH=true
NOTIFY_ON_NEW=true

# Runtime
CURRENT_MOOD=neutral

# Search (RAG) — pass 194: LIVE (lib/config.js RAG getters wired into
# lib/search.js + bin/search.js). Prefer the canonical env names:
#   VANT_RAG_REHYDRATE_MAX_SIZE / VANT_RAG_COMPRESSION_THRESHOLD /
#   VANT_RAG_LIMIT_MAX  (or brain config rag.* keys).
# Bare names below are accepted as legacy env aliases by lib/config.js.
REHYDRATE_MAX_SIZE=51200   # bytes (default 50KB, max 1MB = 1048576); hard bound on rehydrated context
COMPRESSION_THRESHOLD=5120  # bytes trigger for a compression hint (compress() default budget)
RAG_LIMIT_MAX=20          # max results any search call may return (clamps limit/topK)
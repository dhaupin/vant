# Cloudflare Pages Configuration
# https://developers.cloudflare.com/pages/platform/build-configuration/

name = "vant-sync"
compatibility_date = "2024-07-05"

# Pages Functions configuration
[functions]
# Route all /sync requests to the sync.js function
route = "/sync/*"

# Bindings - these come from your Cloudflare dashboard or wrangler.toml
# KV Namespace binding
kv_namespaces = [
  { binding = "VANT_KV", id = "<YOUR_KV_NAMESPACE_ID>" }
]

# Optional: D1 Database binding
# [[d1_databases]]
# binding = "VANT_DB"
# database_name = "vant-db"
# database_id = "<YOUR_D1_DATABASE_ID>"

# Optional: R2 Bucket binding
# [[r2_buckets]]
# binding = "VANT_R2"
# bucket_name = "vant-storage"

# Build settings
[build]
command = ""
cwd = "."

# Output directory for static assets (if any)
# If using Pages Functions only, this can be empty
[builds]
include = [ "*.js", "*.ts" ]

# Environment variables for production
[env.production]
kv_namespaces = [
  { binding = "VANT_KV", id = "<YOUR_KV_NAMESPACE_ID>" }
]

# Environment variables for preview
[env.preview]
kv_namespaces = [
  { binding = "VANT_KV", id = "<YOUR_PREVIEW_KV_NAMESPACE_ID>" }
]

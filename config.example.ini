=== vant CONFIG EXAMPLE ===

# Copy this to config.ini and fill in your values

# Core
VANT_VERSION=v0.8.6
MODEL_PATH=models/public
# (ROADMAP #186: documented) storage.path - the general registry key. Where
# vant stores brain/runtime data; MODEL_PATH above is the public-brain style
# var, VANT_STORAGE_PATH the registry'd general one.
# VANT_STORAGE_PATH=models/private
# STATE_PATH is deprecated - state lives in the brain (models/state.json)

# Listener ports (pass 127 port map - the ONLY ports Vant binds by default)
#   REST server      VANT_SERVER_PORT=3456   (bin/vant.js server)
#   MCP server       VANT_MCP_PORT=3457      (bin/vant.js mcp)
#   Webhook receiver VANT_WEBHOOK_PORT=3467  (lib/webhooks.js)
#   Metrics/health   VANT_HEALTH_PORT=3468   (lib/health.js start())
# Headless mode follows VANT_SERVER_PORT (was a hardcoded 3000 before 0.8.6).
# 3456/3457/3467/3468 were chosen to avoid common co-tenants
# (3000 Grafana/Gitea/Next, 3100 Loki, 5432 postgres, 6379 redis, 8080 generic).
VANT_SERVER_PORT=3456
VANT_MCP_PORT=3457

# Listener binds (bare installs default 127.0.0.1; set 0.0.0.0 only behind a
# reverse proxy or on a segmented VPS network. The Docker image overrides to
# 0.0.0.0 - inside a container that is the correct default, exposure is
# controlled at the host edge. See DEPLOY.md sections 3-4.)
# VANT_SERVER_BIND=127.0.0.1
# VANT_MCP_BIND=127.0.0.1
# VANT_HEALTH_BIND=127.0.0.1
#
# REST TLS + auth (registry: server.cert/server.key/server.insecure/
# server.authRequired). A non-loopback bind without TLS refuses to start
# unless insecure is explicitly set; auth details: docs/security/environment.md
# VANT_SERVER_CERT=./cert.pem
# VANT_SERVER_KEY=./key.pem
# VANT_SERVER_INSECURE=false
# VANT_SERVER_AUTH_REQUIRED=false

# Transport (Stegoframe)
STEGOFRAME_URL=https://stegoframe.creadev.org
STEGOFRAME_ROOM=YOUR_ROOM_ID
STEGOFRAME_PASSPHRASE=YOUR_PASSPHRASE
STEGOFRAME_MODE=svg

# GitHub (set via environment variable)
GITHUB_REPO=your-username/your-repo
GITHUB_BRANCH=main
GITHUB_TOKEN=${GITHUB_TOKEN}

# Runtime
POLLING_INTERVAL=10000
MAX_REQUESTS_PER_HOUR=360

# Memory TTL (in milliseconds)
# Default: learn=24h (86400000), memory=100y (315360000000)
# Bounds: min=1min (60000), max=100years (315360000000)
# learn.ttl=86400000
# memory.ttl=315360000000

# MCP Server (optional - for AI tool access)
# Auth uses VANT_AUTH_KEY (the canon, #189-R1) then deprecated
# VANT_API_KEY / VANT_MCP_API_KEY aliases (or `vant config set mcp.apiKey ...`);
# MCP_API_KEY and MCP_PORT were never read by the runtime.
VANT_MCP_API_KEY=your-secret-api-key
# VANT_AUTH_KEY=canon-transport-auth-key
# VANT_TOKEN_SECRET=token-signing-secret (registry: token.secret; or
#   VANT_BRAIN_PASSWORD for horcrux flows - its cache TTL is
#   VANT_BRAIN_PASSWORD_TIMEOUT, default 900000ms = 15min)
# VANT_MCP_REQUIRE_KEY=false (also settable below in MCP Server Security)

# ===========================================
# SECURITY CONFIGURATION
# See docs/security/ for details
# NOTE (pass 127): the vaf/rate-limit/path tunables below are read through
# config.get() - brain config.json or vant.config.js - NOT from config.ini.
# They are kept here as the canonical reference of key names and defaults.
# ===========================================

# --- VAF (Input Validation & Filtering) ---
# Max string length for inputs (default: 100000)
MAX_STRING_LENGTH=100000
# Max nested object depth (default: 5)
MAX_DEPTH=5
# Max array length (default: 1000)
MAX_ARRAY_LENGTH=1000

# --- Rate Limiting ---
# Max requests per minute (default: 60)
MAX_REQUESTS_PER_MINUTE=60
# Max burst requests (default: 10)
MAX_BURST=10

# --- Path Protection ---
# Max path length (default: 4096)
MAX_PATH_LENGTH=4096
# Block path traversal attempts (default: true)
BLOCK_PATH_TRAVERSAL=true

# --- MCP Server Security ---
# Require API key (default: false - but recommend true for production)
VANT_MCP_REQUIRE_KEY=false

# --- WAL / Message Bus / Log Level ---
# VANT_WAL_ENABLED=true        (registry: wal.enabled; crash-safe writes)
# VANT_MSG_ENCRYPTED=true      (registry: msg.encrypted)
# VANT_MSG_AUTO_ENCRYPT=true   (registry: msg.autoEncrypt)
# VANT_MSG_MAX_PUBLISH_DEPTH=10
# VANT_LOG_LEVEL=info

# --- Audit Logging ---
# Enable audit logging (default: true)
AUDIT_LOG=true
# Audit log file (default: .audit.log)
AUDIT_FILE=.audit.log

# ===========================================
# TEAMS & ORGANIZATION CONFIGURATION
# ===========================================

# --- Teams Storage ---
# Path to teams data file (default: .agent_tmp/teams.json)
teams.store=.agent_tmp/teams.json

# --- Team Limits ---
# Max organizations (default: 10)
teams.maxOrgs=10
# Max departments per org (default: 50)
teams.maxDepts=50
# Max teams per dept (default: 100)
teams.maxTeams=100
# Max roles (default: 200)
teams.maxRoles=200

# --- Agent Limits ---
# Max agents per org (default: 50)
teams.maxAgentsPerOrg=50
# Max agents per dept (default: 50)
teams.maxAgentsPerDept=50
# Max agents per team (default: 20)
teams.maxAgentsPerTeam=20
# Max reports per agent (default: 10)
teams.maxReportsPerAgent=10

# ===========================================
# AGENTS CONFIGURATION
# ===========================================

# --- Agent Spawning ---
# Max total agents (default: 100)
agents.maxAgents=100
# Max agent age in ms (default: 86400000 = 24h)
agents.maxAge=86400000
# Spawn rate limit per minute (default: 10)
agents.spawnRateLimit=10

# ===========================================
# ESCROW BUDGET CONFIGURATION
# ===========================================

# --- Escrow Storage ---
# Path to escrow data file (default: .agent_tmp/escrow.json)
escrow.store=.agent_tmp/escrow.json
# Enable budget persistence (default: true)
persistBudgets=true

# --- Budget Defaults ---
# Default budget per agent (default: 1000)
defaultBudget=1000
# Credit mode - allow negative balance (default: false)
creditMode=false

# --- Circuit Breaker ---
# Failure threshold to open circuit (default: 5)
circuitThreshold=5
# Circuit timeout in ms (default: 60000 = 1min)
circuitTimeout=60000

# ===========================================
# ENV REGISTRY (truthful inventory of every general-runtime VANT_* env var
# the codebase reads - lib/config.js ENV_REGISTRY is the reader of record).
# LIVE introspection: `vant config list env` prints all entries with the
# RESOLVED value this process runs under (secrets masked). Per-domain vars
# (VANT_UNIVERSE_SEED / VANT_MESH_SECRET / VANT_SUDO_* / VANT_REMOTE_* and
# the rest of the VANT_STORAGE_* family) are documented in their domain
# modules, not here. Anything below commented out = runs at its default.
# ===========================================

# --- Server / listeners ---
# VANT_SERVER_PORT=3456          fallback 3456
# VANT_SERVER_BIND=127.0.0.1     fallback 127.0.0.1
# VANT_SERVER_CERT=              (path, null)   requires TLS pair
# VANT_SERVER_KEY=               (path, null)   secret
# VANT_SERVER_INSECURE=false
# VANT_SERVER_AUTH_REQUIRED=false
# VANT_MCP_PORT=3457
# VANT_MCP_BIND=127.0.0.1
# VANT_MCP_SERVE_WEB=            (path, null) frontend dir whose dist/ the MCP
#                               door serves at / (prd-web.md 3.1 Mode B; OFF when unset)
# VANT_WEBHOOK_PORT=3467
# VANT_WEBHOOK_BIND=127.0.0.1
# VANT_WEBHOOK_SECRET=           secret
# VANT_WEBHOOK_URL=
# VANT_HEALTH_PORT=3468
# VANT_HEALTH_BIND=127.0.0.1

# --- Auth / tokens (all secret) ---
# VANT_AUTH_KEY=                 canon transport auth (#189-R1; warn-once alias VANT_API_KEY)
# VANT_API_KEY=                  deprecated alias of VANT_AUTH_KEY
# VANT_MCP_API_KEY=              MCP door key
# VANT_TOKEN_SECRET=             token signing
# Provider variants below are secret too.

# --- Sync / Git ---
# VANT_GITHUB_TOKEN=             secret (or GITHUB_TOKEN; set via env)
# VANT_GITHUB_REPO=dhaupin/vant  fallback owner/repo name
# VANT_AGREE_AUTO_SYNC=false     explicit opt-in for auto-sync side effects
# VANT_SYNC_INTERVAL=300000      fallback ms between sync polls
# VANT_SYNC_OP_TIMEOUT_MS=120000
# VANT_GIT_TIMEOUT_MS=60000
# VANT_HTTP_TIMEOUT_MS=15000
# GIT_TOKEN=                     secret (generic git credential)
# GITLAB_TOKEN= secret | GITLAB_URL=https://gitlab.com
# GITEA_TOKEN=  secret | GITEA_URL=https://gitea.com
# BITBUCKET_TOKEN=               secret

# --- Brain / storage / agent identity ---
# VANT_BRAIN=                    named-brain scope (stack override)
# VANT_STORAGE_PATH=models/private
# VANT_BRAIN_PASSWORD_TIMEOUT=900000  ms the brain password stays cached
# VANT_AGENT_ID=
# VANT_AGENTS_MAX=10             crew roster quota (registry key agents.maxAgents)
# VANT_LOG_LEVEL=info

# --- Messages / WAL / QoS ---
# VANT_MSG_ENCRYPTED=true
# VANT_MSG_AUTO_ENCRYPT=true
# VANT_MSG_MAX_PUBLISH_DEPTH=10
# VANT_WAL_ENABLED=true
# VANT_QOS_MAX_PER_MINUTE=       (null = module default)
# VANT_QOS_MAX_PER_HOUR=         (null = module default)

# --- Prune / clean ---
# VANT_PRUNE_STALE_DAYS=90
# VANT_PRUNE_MAX_SIZE_MB=100
# VANT_PRUNE_AUTO_CLEAN=false
# VANT_CLEAN_LOGS=true
# VANT_CLEAN_TMP=true
# VANT_CLEAN_CACHE=true
# VANT_CLEAN_MAX_LOG_MB=10
# VANT_CLEAN_MAX_LOG_AGE_DAYS=7

# --- RAG (pass 194; legacy bare names in settings.example.ini alias these) ---
# VANT_RAG_REHYDRATE_MAX_SIZE=51200
# VANT_RAG_COMPRESSION_THRESHOLD=5120
# VANT_RAG_LIMIT_MAX=20

# --- Escrow / market ---
# VANT_ESCROW_DEFAULT_BUDGET=1000
# VANT_MARKET_SKILLS_ENABLED=false   skills marketplace gate (OFF default)
# VANT_MARKET_SKILLS_TRADE_TTL_MS=259200000  (72h; clamped 60s-30d)
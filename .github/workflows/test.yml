name: VANT CI

# Minutes-efficient CI: ONE job does everything (tests + security + validate).
# Concurrency cancels in-flight runs when a newer push lands on the same
# branch/PR so stale runs don't burn Actions minutes.
on:
  workflow_dispatch:
  push:
    # axolotl is the working batch branch: batch passes land there BEFORE
    # any PR opens (post-merge, no PR event exists) - so push-trigger CI
    # must cover it or batch passes ship ungated.
    branches: [main, develop, 'agent-*', axolotl]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly (default branch only, single job = cheap)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # (pass 293) 8 → 12: the same suite wall as the old bare loop PLUS the
    # per-suite baseline restore (~0.2s × 217) and live-fire timer suites
    # (lock/lease ~15-20s each) must survive a slow runner's worst shuffle.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security checks (tokens + npm audit)
        run: |
          ! grep -rE "ghp_[a-zA-Z0-9]{36}" . --include="*.js"
          npm audit --audit-level=high

      - name: Run tests
        run: |
          node -e "console.log('vant', require('./package.json').version)"
          node test/ci.js
          node test/runner.js
          node test/evals/vibe.js
          node test/coverage.js

      - name: Surface consistency (no phantom endpoints, links, community doors)
        run: npm run lint:surface

      - name: web/home gate (links, fiction, stat truth)
        run: npm run lint:home

      - name: changelog parity gate (site json vs CHANGELOG.md byte-compare, version truth)
        run: npm run lint:changelog

      - name: Fiction signatures (repo-wide, wrong-claims regression gate)
        run: npm run lint:claims

      - name: Language gate (prose is English-only, issue #184)
        run: node scripts/check-language.js

      - name: Docs truthfulness gate (doc promises resolve to real tree, R3-F9)
        run: node scripts/check-docs-truthfulness.js

      - name: Run standalone suites
        # (pass 293) THE HARNESS, not a bare loop: the old `for f in …`
        # chain ran 217 suites in ONE shared environment, so suite N's
        # brain-pointer/roster residue became suite N+1's environment and
        # sweep results depended on ordering (live-fire repro: guests
        # tripped agents.maxAgents on a roster the prior suite left;
        # teams-refresh ENOENTed on a mutated state.json). run-all gives
        # every suite the same baseline (per-suite slate restore, see
        # test/slate.js) and exits 1 on failures / 2 on timeouts.
        run: node test/run-all.js

  # The crashtest pack matrix as its OWN gate (separate runner budget from
  # the main suite wall): the strict contract table + the REAL harness run
  # root, under one known-findings whitelist — any finding outside it is a
  # regression and fails the job. Honest skips and the whitelisted pins
  # never mask a new raise; a fix that flips a row REFUSED succeeds and the
  # gate asks loudly for the whitelist line to be deleted.
  crashtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # crashtest@1.0.0 ships on npm — the consumption path — so the
        # CI gate runs the REAL pack loader + Harness straight from the
        # installed package, no clone step.
        run: npm ci

      - name: Crashtest gate (contract table + real-harness run root)
        run: node test/ci-crashtest-gate.js

name: VANT CI

# CI split so wall time is a MAX, not a sum. Measured 2026-11-04: the old one
# job serialized ~14 independent gates behind the suite wall (227 suites /
# 450s serial on this tree, all green; the 20 slowest suites are 73% of the
# wall — forum-decisions-persistence alone 86.6s, the livefire timers ~110s).
# Two jobs now run IN PARALLEL:
#   ci    — the gates: security, smoke doors, packs/poststruct/govstruct/
#           dep-ledger/changelog/claims/language/docs/ledger checks.
#   sweep — the suite wall as a 4-way round-robin shard matrix
#           (test/run-all.js --shard=N/4). Each shard is its own runner with
#           its own checkout, so the order-independence seam (test/slate.js)
#           never has two suites racing one workspace; the per-suite count of
#           each shard's own receipts proves the split covers every suite.
# Concurrency cancels in-flight runs when a newer push lands on the same
# branch/PR so stale runs don't burn Actions minutes.
on:
  workflow_dispatch:
  push:
    # The staging rule (poststruct#32's canon; eyestruct#21 was the reuse,
    # adopted vant-wide in wave 16, vant#272): staging is the PERMANENT
    # integration branch - work PRs target it, promotion to main is the
    # only way out. axolotl is the free-bird dev branch: batch passes still
    # land there BEFORE any PR opens (post-merge, no PR event exists), so
    # push CI must cover it too or batch passes ship ungated. `develop` no
    # longer rides the list: it has not existed in the branch slate for a
    # while (checked on adoption day) and a trigger for a missing branch
    # is drift by another name.
    branches: [main, staging, 'agent-*', axolotl]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: '0 0 * * 0'  # Weekly (default branch only); the gates + shards fanout re-measures drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # (pass 293) 8 → 12: the per-suite baseline restore (~0.2s × 217) and
    # live-fire timer suites (lock/lease ~15-20s each) must survive a slow
    # runner's worst shuffle. The gates below are independent of the sweep
    # shards and run alongside them for free.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security checks (tokens + npm audit)
        run: |
          ! grep -rE "ghp_[a-zA-Z0-9]{36}" . --include="*.js"
          # --omit=dev: eyestruct (dev-only, the visual gate) rides the
          # puppeteer chrome-installer chain, whose extract-zip dep carries
          # an upstream high advisory with NO fix - the chain exists only
          # for LAN-local capture verbs (look/diff/walk), which vant's CI
          # never runs (the gate lane is browserless by design). The prod
          # tree stays clean-0-high, and that is the surface CI promises.
          npm audit --omit=dev --audit-level=high

      - name: Smoke doors (runner + 39-pin smoke batch)
        run: |
          node -e "console.log('vant', require('./package.json').version)"
          node test/ci.js
          node test/runner.js

      - name: Eyes gate (eyestruct@1.0 visual ledger, browserless)
        # The crashtest lane aimed at appearance instead of attackability.
        # eyestruct@1.0 (npm v1.0.0): `gate` is read-only over
        # labs/.eyes/ - every committed visual artifact must be explained
        # by a ledger row and every row must reference a live artifact on
        # disk. Browserless by design: capture verbs (look/diff/walk) are
        # LAN-local against the pinned chrome; CI runs the meanings, not
        # the pixels.
        run: npx eyestruct gate

      - name: Packs deep lint (packstruct@1 author-time gate, vant#247)
        # The live-corpus receipt + CI lane, same commit: every pack
        # manifest is checked against the real SPEC v1 (fields, name==dir,
        # entry-exists, version shape) and --deep probes each entry's
        # import + default export + id census. Zero sockets, in-process,
        # runs in seconds; a violation fails the job at author time
        # instead of failing a pack load somewhere downstream.
        run: npm run packs:lint

      - name: Packs conformance audit (packstruct §7 harness, ALLOWED-pinned)
        # The host-loader face (crashtest's real loader) runs against
        # packstruct's bundled conformance corpus. Regressions outside the
        # allowlist fail the job; the pinned "clean" row is the documented
        # engine finding, deleted when its fix lands (see
        # scripts/audit-packs-gate.js for the honest pin).
        run: npm run packs:audit

      - name: Surface consistency (no phantom endpoints, links, community doors)
        run: npm run lint:surface

      - name: web/home gate (links, fiction, stat truth)
        run: npm run lint:home

      - name: web/home config pin suite (vitest, pass 338 — the pins never ride CI until now)
        run: npm ci --prefix web/home && npm --prefix web/home run test:run

      - name: Poststruct audit (poststruct@1.0 — the baked-HTML shipped contract)
        # The four-STRUCT board closes its loop (issue #264's last family).
        # poststruct walks the BAKED web/home dist post-build and verifies
        # head/site/links/i18n/a11y/feeds + the language profile; FAIL
        # findings exit non-zero and gate the job. Files on disk only:
        # browserless, zero-dep, no network. The repo config
        # (poststruct.config.js) demotes the dash-class law to warn — the
        # house copy writes em/en dashes by design; every other check
        # rides the family default. Restamp the feed row in the same
        # change as any copy change: npm run build:home && npm run
        # struct:stamp -- --rows poststruct (struct:check pins it).
        run: npm run build:home && npx poststruct audit web/home/dist --json

      - name: govstruct identity gate (one-member adopter manifest, offline)
        # The governance layer lands (govstruct@1.0.0): this repo's own
        # identity/conformance manifest - one member (vant), a real member
        # block, and an evidence-map compliance block pointing at the CI
        # lanes that actually run (no invented statuses). Fully offline:
        # lint (manifest grammar), check (the compliance shape packs),
        # surface --verify (the promised-field contract), doctor (the base
        # battery - --network stays opt-in, this call is socket-free).
        run: npx govstruct lint && npx govstruct check && npx govstruct surface --verify && npx govstruct doctor

      - name: Dependency ledger census (depstruct - the never-add-deps law)
        # Vant basically never adds dependencies; this lane makes that a
        # check instead of a vibe (wave 19.31). The ledger inside
        # scripts/audit-deps.js is the only door a dependency rides
        # through: a conscious row with lane + honest note, real evidence
        # of that lane in the tree, the family pin the compliance map
        # records, and package-lock resolution. Fully offline; the
        # compliance cross-check keeps govstruct's evidence map unable to
        # drift from the tree it describes. gistory-sync gets a typed
        # pre-npm guard: declaring a 404 dep breaks npm ci for every
        # consumer (the registry-ladder law, packs/README.md).
        #
        # Wave 19.32: the crew picks up pickup-handler duty in CI too
        # — spot probes (--probe) exercise the handler over a code-lane
        # dep and the family floor carrier, so the one-name door the
        # fleet can call for can never silently rot behind the full
        # census.
        run: |
          npm run lint:deps
          node scripts/audit-deps.js --probe jsqr
          node scripts/audit-deps.js --probe crashtest

      - name: changelog parity gate (site json vs CHANGELOG.md byte-compare, version truth)
        run: npm run lint:changelog

      - name: Fiction signatures (repo-wide, wrong-claims regression gate)
        run: npm run lint:claims

      - name: Language gate (prose is English-only, issue #184)
        run: node scripts/check-language.js

      - name: Docs truthfulness gate (doc promises resolve to real tree, R3-F9)
        run: node scripts/check-docs-truthfulness.js

      - name: Pass-ledger open-items gate (drift is machine-visible, pass-354 arc)
        # The pass-ledger census reads the REAL ledger docs and pins them
        # to a committed snapshot: any open-item open/close/line-move must
        # update labs/open-items.snapshot.json in the SAME commit as the
        # ledger edit - a conscious act, never background churn. The
        # weekly cron re-runs this job, so drift is re-measured weekly
        # even when the week's commits never touched a ledger.
        run: npm run ledger:gate

  # The suite wall, NOT a bare serial run: (pass 293) the old `for f in …`
  # chain ran 217 suites in ONE shared environment, so suite N's
  # brain-pointer/roster residue became suite N+1's environment and sweep
  # results depended on ordering (live-fire repro: guests tripped
  # agents.maxAgents on a roster the prior suite left; teams-refresh
  # ENOENTed on a mutated state.json). run-all gives every suite the same
  # baseline (per-suite slate restore, see test/slate.js) and exits 1 on
  # failures / 2 on timeouts.
  # (pass 363) THE WALL ITSELF FANS OUT: a 4-way shard matrix cuts the
  # measured 450s serial wall to its longest shard (top-20 slowest suites =
  # 73% of the wall, so shards round-robin the sorted list to spread the
  # slow clusters — test/run-all.js --shard). fail-fast is off on purpose:
  # a red shard must not cancel the others' receipts.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Baseline seed (the wall's precondition)
        # The sweep's health. In the pre-shard lane this seeding happened
        # IMPLICITLY because `node test/ci.js` always ran first inside the
        # one big job, so `run-all` never saw a bare checkout
        # (fresh-install-resolution.test.js documents the dependency).
        # Shards start from a bare checkout, so the seed is now an explicit
        # step — without it the state-dependent pins fail on missing
        # artifacts (measured on the 5b88257c run: init-wizard rerun-grant
        # and state-persistence #224 in shard 1, kernel-wiring census
        # ENOENT in shard 2, all green once seeded).
        run: node test/ci.js

      - name: Suite wall shard ${{ matrix.shard }}/4
        run: node test/run-all.js --shard=${{ matrix.shard }}/4

  # The crashtest pack matrix as its OWN gate (separate runner budget from
  # the main suite wall): the strict contract table + the REAL harness run
  # root, under one known-findings whitelist — any finding outside it is a
  # regression and fails the job. Honest skips and the whitelisted pins
  # never mask a new raise; a fix that flips a row REFUSED succeeds and the
  # gate asks loudly for the whitelist line to be deleted.
  crashtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # crashtest@1.1.0 ships on npm — the consumption path (the S0→S1
        # v1.0.x→v1.1.0 adoption, vant#249) — so the CI gate runs the
        # REAL pack loader + two-pod Harness + expectation tables straight
        # from the installed package, no clone step.
        run: npm ci

      - name: Determinism preflight (crashtest #13 blocker 3, adopted with the 1.1.0 run root)
        # The no-wall-clock law enforced for free: flat-greps the declared
        # pack sources for Date.now / new Date( / Math.random and exits 2
        # naming file:line. Wire-once, every pack's determinism law holds.
        run: npx crashtest lint-determinism

      - name: Crashtest gate (contract table + real-harness run root)
        run: node test/ci-crashtest-gate.js

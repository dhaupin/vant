name: VANT CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'agent-*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run CI tests
        run: node test/ci.js
      - name: Run full suite
        run: node test/runner.js
      - name: Run v0.8.6 tests
        run: node bin/test-v086.js
      - name: Run Vibe Evals
        run: node test/evals/vibe.js

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Load config
        run: node -e "require('./lib/config')"
      - name: Load auto-update
        run: node -e "require('./lib/auto-update')"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Check tokens (should find none)
        run: '! grep -rE "ghp_[a-zA-Z0-9]{36}" . --include="*.js" '
      - name: Check npm audit
        run: npm audit --audit-level=high

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Show version
        run: node -e "console.log(require('./package.json').version)"

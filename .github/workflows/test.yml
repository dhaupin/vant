name: VANT CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'agent-*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Run CI tests
        run: node test/ci.js --json
      - name: Run full suite
        run: node test/runner.js

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Syntax check bins
        run: node -e "require('./bin/vant.js')"
      - name: Syntax check libs
        run: node -e "require('./lib/config')"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: VAF tests
        run: node test/ci.js --lib=vaf
      - name: No leaked tokens
        run: '! grep -rE "ghp_[a-zA-Z0-9]{36}" . --include="*.js" || exit 1'

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Health check
        run: node bin/health.js
      - name: Load brain
        run: node bin/load.js v0.5.0
      - name: Output version
        run: node -e "console.log('Version:', require('./package.json').version)"

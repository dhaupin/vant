name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './docs'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll
        run: |
          cd docs
          bundle exec jekyll build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # (debloat pass) This used to be the 20-line curl-scrape-tar dance hand-
      # copied from prestruct's docs workflow (fix: align pagefind steps with
      # prestruct workflow). Pagefind ships an official npm distribution now
      # (binary behind os-arch optional deps), so the block is one install:
      # no GitHub-API scrape to rate-limit, no hand-fetched tarball, no arch
      # guess. Pinned mutable-latest = the version the npm registry serves,
      # same posture as the prestruct docs site it came from.
      - name: Install Pagefind (npm)
        working-directory: docs
        run: npm i --no-save --no-audit --no-fund pagefind

      - name: Create search index
        working-directory: docs
        run: npx pagefind --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
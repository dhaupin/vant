name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './docs'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll
        run: |
          cd docs
          bundle exec jekyll build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Pagefind
        working-directory: docs
        run: |
          # Unauthenticated api.github.com calls from shared runner IPs get
          # rate-limited; an empty VERSION then yields a malformed asset URL
          # whose 404 HTML body makes tar fail with "not in gzip format".
          # Send the workflow token on the scrape and REFUSE to continue on
          # an unparseable tag instead of downloading garbage.
          VERSION=$(curl -sL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Pagefind/pagefind/releases/latest" \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not resolve the latest pagefind tag (got '$VERSION') — likely an API failure."; exit 1 ;;
          esac
          echo "pagefind version: v${VERSION}"
          curl -sL --retry 3 --retry-delay 5 \
            "https://github.com/pagefind/pagefind/releases/download/v${VERSION}/pagefind-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o pagefind.tar.gz
          tar -xzf pagefind.tar.gz
          rm pagefind.tar.gz
          chmod +x pagefind

      - name: Create search index
        working-directory: docs
        run: ./pagefind --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Vant docs - a THIN caller of THE one docs lane (dhaupin/freestruct).
#
# The runbook (Jekyll, the hardened pagefind scrape, the pinned freestruct
# post-build layer, the Pages upload, the main-gated deploy) lives ONCE in the
# lane. This file keeps only what is per-repo: the trigger, the permissions,
# the concurrency group, and the input pins that are vant's. It used to inline
# the whole runbook (one of the family hand-copies the consolidation removed).
#
# Coverage rides every integration lane (vant#272): staging and axolotl build
# the docs battery but cannot publish - the lane's deploy job gates to main
# INSIDE the reusable workflow, because once a lane is in a trigger list the
# trigger no longer keeps its content out of production; the branch check does.
#
# Pins, never floats: the lane is called at a 40-hex SHA, and freestruct is
# pinned EXACT (a range floats the engine = a random deploy). freestruct-cmd
# stays the lane default (node node_modules/freestruct/bin/freestruct.mjs):
# the lane installs the pinned npm engine itself, so the hand-rolled
# docs/package.json pipeline retires and the deploy can no longer float to
# `npx freestruct` latest.
name: Deploy Docs

on:
  push:
    branches: [main, staging, axolotl]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@22bb7e9b2634d6cdd966963d9e25c7f892577276 # main
    with:
      ruby-version: '3.4'
      freestruct-version: '1.2.0'

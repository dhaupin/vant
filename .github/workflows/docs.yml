name: Deploy Docs

on:
  push:
    # CI coverage rides BOTH integration lanes (the staging rule,
    # vant#272 point 2): staging builds run the docs battery but the
    # deploy job below gates itself to main - a Pages publish may never
    # ride a trigger list, only a branch check (point 3).
    branches: [main, staging]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './docs'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll
        run: |
          cd docs
          bundle exec jekyll build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Post-render SEO layer (the freestruct conversion): the hand-rolled
      # sitemap.xml / robots.txt pages are retired - the engine generates a
      # full sitemap with real lastmod, a basePath-aware robots pointer, a
      # noindex 404.html and an RSS feed over the build output. The Vant
      # docs were freestruct's prototype; docs/package.json consumes the
      # npm v1.0.0 package (ADOPTED: freestruct@1.0.0 is confirmed live on
      # the registry holding the `latest` dist-tag as of the pass-338
      # sweep, so the old publish gate has settled; the exact pin stays).
      # Config discovery walks upward from cwd and finds
      # docs/freestruct.config.yml; the output dir resolves config-relative
      # to docs/_site; render-time Jekyll nav/redirects plugins are
      # untouched. --strict: broken internal links fail the build (--strict
      # is what catches production 404s on the freestruct docs site).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install docs pipeline deps
        working-directory: docs
        run: npm install --no-audit --no-fund

      - name: Run freestruct (post-render SEO layer, strict)
        run: npx freestruct --strict

      # Pagefind indexes AFTER freestruct: the engine rewrites the HTML
      # (metas, cache-busting, lazy loading) and the index must match what
      # ships. Same posture as the freestruct docs site itself.
      - name: Create search index
        working-directory: docs
        run: npx pagefind --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Production gate (vant#272 point 3): visibility in a trigger list
    # never keeps content out of production - the branch check does.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
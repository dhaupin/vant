# VANT CI - Main continuous integration workflow
name: VANT CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'agent-*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run CI tests
        run: node test/ci.js --json
        
      - name: Run full test suite
        run: node test/runner.js
        
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Check syntax
        run: |
          for f in lib/*.js bin/*.js; do
            node --check "$f" || exit 1
          done
          
      - name: Check required files
        run: |
          ls -la bin/vant.js lib/vaf.js lib/config.js lib/lock.js lib/branch.js
          
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Test VAF - script injection
        run: node -e "
          const vaf = require('./lib/vaf');
          const tests = [
            '<script>', true,
            '<img onerror=1>', true,
            'javascript:alert(1)', true,
            'rm -rf /', true,
            '\$(whoami)', true,
          ];
          let failed = 0;
          tests.forEach(([input, shouldBlock]) => {
            const r = vaf.checkContent(input);
            if (r.blocked !== shouldBlock) {
              console.log('FAIL:', input, 'got', r.blocked, 'expected', shouldBlock);
              failed++;
            }
          });
          if (failed > 0) process.exit(1);
        "
        
      - name: Test VAF - path traversal
        run: node -e "
          const vaf = require('./lib/vaf');
          const tests = [
            '../etc/passwd', true,
            '/etc/passwd', true,
            '..', true,
            'models/public/goals.md', false,
          ];
          let failed = 0;
          tests.forEach(([input, shouldBlock]) => {
            const r = vaf.checkPathTraversal(input);
            if (r.blocked !== shouldBlock) {
              console.log('FAIL:', input, 'got', r.blocked, 'expected', shouldBlock);
              failed++;
            }
          });
          if (failed > 0) process.exit(1);
        "
        
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Test library loads
        run: node -e "
          const libs = ['vaf','config','lock','branch','brain','logger','errors','entropy'];
          libs.forEach(lib => require('./lib/' + lib));
        "
        
      - name: Test binaries
        run: |
          for bin in vant health load sync; do
            timeout 3 node bin/$bin.js || true
          done
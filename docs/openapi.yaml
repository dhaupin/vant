openapi: 3.1.0
info:
  title: Vant API
  description: |
    Vant is a persistent memory system for AI agents.

    ## Spec Alignment (verified against lib/server.js + lib/api.js)
    - Auth: OPTIONAL API key — active only when VANT_SERVER_AUTH_REQUIRED=1
      (or server.authRequired config); the credential is the x-api-key
      header compared against VANT_API_KEY. There is NO JWT issuance
      anywhere in the tree; bearerFormat JWT is not a thing Vant serves.
    - QoS enforced via rate limiting (X-RateLimit-* headers)
    - Live surface: /health, /call plus the registered REST
      routes (brain/streams/trust/market) from lib/api.js startREST —
      GET /tools answers 410 Gone (retired, issue #187; the MCP door is
      the tool surface and keeps its own /tools alias at 200)
      NOT /v1/embeddings or /api/v1/* (those endpoints do not exist in
      this tree; this spec lists the real ones below).

    ## Authentication (when authRequired is on)
    ```
    x-api-key: <VANT_API_KEY>
    ```
  version: 0.8.6
  contact:
    name: Vant Team
    url: https://vant.creadev.org

servers:
  - url: http://localhost:3456
    description: Local (loopback default)

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # Common
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer

    BrainFile:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        source:
          type: string
          enum: [public, private, remote]
        updated:
          type: string
          format: date-time

    BrainList:
      type: object
      properties:
        brains:
          type: array
          items:
            $ref: '#/components/schemas/BrainFile'

    Island:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [static, lazy]
        triggers:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    SearchResult:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              score:
                type: number
              content:
                type: string

    ConfigValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        layers:
          type: object

tags:
  - name: Brain
    description: Brain file operations
  - name: Islands
    description: Island (brain module) operations
  - name: Search
    description: Search and RAG operations
  - name: Config
    description: Configuration management
  - name: Stream
    description: Stream operations
  - name: System
    description: System operations

paths:
  # ============================================
  # SYSTEM (built-ins on every lib/server.js instance)
  # ============================================
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /tools:
    get:
      tags:
        - System
      summary: "Retired (issue #187): 410 Gone - the MCP door is the tool surface"
      operationId: listTools
      responses:
        '410':
          description: Retired with a pointer to the MCP door (GET /tools there stays 200)

  /call:
    post:
      tags:
        - System
      summary: Execute a tool
      description: Accepts the JSON-RPC tools/call envelope or flat {tool, args}
      operationId: callTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Tool result

  # ============================================
  # BRAIN (REST routes from lib/api.js startREST)
  # ============================================
  /brain:
    get:
      tags:
        - Brain
      summary: Current brain state (backs onto brain_state)
      operationId: getBrainState
      responses:
        '200':
          description: Brain state

  /brain/ls:
    get:
      tags:
        - Brain
      summary: List brain files (backs onto brain_list)
      operationId: listBrainFiles
      responses:
        '200':
          description: File list

  /brain/{name}:
    get:
      tags:
        - Brain
      summary: Load a brain file (backs onto brain_load)
      operationId: loadBrain
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content (id/name/content)

    post:
      tags:
        - Brain
      summary: Save a brain file (backs onto brain_save)
      operationId: saveBrain
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Saved

  # ============================================
  # STREAMS (work items)
  # ============================================
  /streams:
    get:
      tags:
        - Streams
      summary: List streams (stream_list)
      operationId: listStreams
      responses:
        '200':
          description: Stream list

    post:
      tags:
        - Streams
      summary: Create a stream (stream_create)
      operationId: createStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Created

  /streams/{id}:
    get:
      tags:
        - Streams
      summary: Stream info (stream_info)
      operationId: streamInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream info

  /streams/{id}/enqueue:
    post:
      tags:
        - Streams
      summary: Enqueue work (stream_enqueue)
      operationId: enqueueWork
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Enqueued

  /streams/{id}/poll:
    post:
      tags:
        - Streams
      summary: Poll for work (stream_poll)
      operationId: pollStream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Work item or empty

  # ============================================
  # TRUST
  # ============================================
  /trust/score/{entity}:
    get:
      tags:
        - Trust
      summary: Score for an entity (trust_getScore)
      operationId: getScore
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Score

  /trust/record:
    post:
      tags:
        - Trust
      summary: Record a trust event (trust_record)
      operationId: recordTrust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Recorded

  /trust/leaderboard:
    get:
      tags:
        - Trust
      summary: Trust leaderboard (trust_leaderboard)
      operationId: trustLeaderboard
      responses:
        '200':
          description: Leaderboard

  # ============================================
  # MARKET
  # ============================================
  /market/listings:
    get:
      tags:
        - Market
      summary: Search listings (market_search, query params)
      operationId: searchListings
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Listings

  /market/list:
    post:
      tags:
        - Market
      summary: List a new listing (market_list)
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Created

  /market/bid:
    post:
      tags:
        - Market
      summary: Place a bid (market_bid)
      operationId: placeBid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Bid placed

  /market/trade:
    post:
      tags:
        - Market
      summary: Execute a trade (market_trade)
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Traded

  /market/stats:
    get:
      tags:
        - Market
      summary: Market stats (market_stats)
      operationId: marketStats
      responses:
        '200':
          description: Stats

  /market/listing/{id}:
    get:
      tags:
        - Market
      summary: One listing by id (market_get)
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Listing
        '404':
          description: Not found

  # ============================================
  # MCP door on the MCP server (startMCP, port 3457)
  # ============================================
  /mcp/tools:
    get:
      tags:
        - System
      summary: The MCP tool list (MCP server door)
      operationId: mcpTools
      responses:
        '200':
          description: Tools

  /mcp/exec:
    post:
      tags:
        - System
      summary: Execute an MCP tool (MCP server door)
      operationId: mcpExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tool:
                  type: string
                args:
                  type: object
      responses:
        '200':
          description: Tool result

# Jekyll config for Vant docs
title: Vant
baseurl: "/vant"
url: "https://docs.creadev.org"
description: AI memory for agents
markdown: kramdown
highlighter: rouge

# Build settings
permalink: :title
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

# Plugins (Jekyll 3+) / Gems (Jekyll 2)
gems:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Navigation - auto-sorted from nav_order frontmatter + overrides at top
# Order: Getting Started → Guides → Reference
nav:
  - title: Getting Started
    items:
      - title: Installation
        url: /vant/getting-started/install/
      - title: Quick Start
        url: /vant/getting-started/quick-start/
  - title: Reference
    items:
      - title: CLI Reference
        url: /vant/reference/cli.html
      - title: Module API
        url: /vant/reference/api.html
      - title: Configuration
        url: /vant/reference/configuration.html

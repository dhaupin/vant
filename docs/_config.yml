# Jekyll config for Vant docs
title: Vant
baseurl: "/vant"
url: "https://docs.creadev.org"
description: AI memory for agents
markdown: kramdown
highlighter: rouge

# Build settings
# pretty = /path/ (with trailing slash)
# :title = /path (clean, no ext or slash)
# But individual page frontmatter overrides this
permalink: :title
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

# Plugins
gems:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Auto-generate nav from folder structure (no manual nav)
# Section order in nav (lower = higher)
nav_order:
  getting-started: 10
  essential: 20
  reference: 30
  integrations: 40
  operations: 50
  tutorials: 60
  advanced: 70
  security: 80

# Section display names (override folder name)
nav_sections:
  getting-started: Getting Started
  essential: Core Concepts
  reference: Reference
  integrations: Integrations
  operations: Operations
  tutorials: Tutorials
  advanced: Advanced
  security: Security

# Jekyll config for Vant docs
title: Vant
baseurl: "/vant"
url: "https://docs.creadev.org"
description: AI memory for agents
markdown: kramdown
highlighter: rouge

# Build settings
# pretty = /path/ (with trailing slash)
# :title = /path (clean, no ext or slash)
# But individual page frontmatter overrides this
permalink: :title
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

# Plugins
gems:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Navigation - explicit order (manual override, reliable)
nav:
  - title: Getting Started
    items:
      - title: Installation
        url: /vant/getting-started/install
      - title: Quick Start
        url: /vant/getting-started/quick-start
  - title: Guides
    items:
      - title: AI Onboarding
        url: /vant/guides/ai-onboard
      - title: Brain
        url: /vant/guides/brain
      - title: Islands
        url: /vant/guides/islands
      - title: Vibe
        url: /vant/guides/vibe
      - title: Multi-Agent
        url: /vant/guides/multi-agent
      - title: Multi-Repo
        url: /vant/guides/repos
      - title: Hybrid Sync
        url: /vant/guides/hybrid
      - title: Hybrid Search
        url: /vant/guides/search
      - title: MCP
        url: /vant/guides/mcp
      - title: Security
        url: /vant/guides/security
      - title: Schema
        url: /vant/guides/schema
      - title: Audit
        url: /vant/guides/audit
      - title: Stego
        url: /vant/guides/stego
      - title: Providers
        url: /vant/guides/providers
      - title: Sync
        url: /vant/guides/sync
      - title: Airgap
        url: /vant/guides/airgap-propagation
  - title: Reference
    items:
      - title: CLI Reference
        url: /vant/reference/cli

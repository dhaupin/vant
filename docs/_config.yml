# Jekyll config for Vant docs
title: Vant
baseurl: "/vant"
url: "https://docs.creadev.org"
description: AI memory for agents
markdown: kramdown
highlighter: rouge

# Build settings
permalink: :title
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

# Plugins
gems:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Navigation - explicit order (manual override, reliable)
nav:
  - title: Getting Started
    items:
      - title: Installation
        url: /vant/getting-started/install/
      - title: Quick Start
        url: /vant/getting-started/quick-start/
  - title: Guides
    items:
      - title: AI Onboarding
        url: /vant/guides/ai-onboard.html
      - title: Brain
        url: /vant/guides/brain.html
      - title: Islands
        url: /vant/guides/islands.html
      - title: Vibe
        url: /vant/guides/vibe.html
      - title: Multi-Agent
        url: /vant/guides/multi-agent.html
      - title: Multi-Repo
        url: /vant/guides/repos.html
      - title: Hybrid Sync
        url: /vant/guides/hybrid.html
      - title: Hybrid Search
        url: /vant/guides/search.html
      - title: MCP
        url: /vant/guides/mcp.html
      - title: Security
        url: /vant/guides/security.html
      - title: Schema
        url: /vant/guides/schema.html
      - title: Audit
        url: /vant/guides/audit.html
      - title: Stego
        url: /vant/guides/stego.html
      - title: Providers
        url: /vant/guides/providers.html
      - title: Sync
        url: /vant/guides/sync.html
      - title: Airgap
        url: /vant/guides/airgap-propagation.html
  - title: Reference
    items:
      - title: CLI Reference
        url: /vant/reference/cli.html
      - title: Module API

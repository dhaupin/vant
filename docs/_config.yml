# Jekyll config for Vant docs
title: Vant
baseurl: "/vant"
url: "https://docs.creadev.org"
description: AI memory for agents
markdown: kramdown
highlighter: rouge

# Build settings
permalink: :title
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'tmp', 'pagefind*']

# Kramdown settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    css_class: 'highlight'
  toc_levels: [1, 2, 3, 4, 5, 6]
  auto_ids: true
  auto_id_prefix: ''

# Plugins
gems:
  - jekyll-redirect-from
plugins:
  - jekyll-redirect-from

# Nav section titles (auto-generated from folders)
nav_sections:
  guides: Guides
  reference: Reference
  getting-started: Getting Started
  tutorials: Tutorials

# Override folder order
nav_order:
  getting-started: 1
  guides: 2
  tutorials: 3
  reference: 4

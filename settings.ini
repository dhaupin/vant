=== VANT SETTINGS ===

User-adjustable settings. Can be changed without code.
Copy to settings.ini to activate.

# Identity
HANDLE=Vant
DISPLAY_NAME=Vant

# Personality (0-100)
DIRECTNESS=70
CURIOSITY=80
PATIENCE=70

# Output
VERBOSITY=normal
EMOJI_ENABLED=true
MARKDOWN_ENABLED=true

# Behavior
AUTO_SAVE=true
AUTO_PUSH=true
NOTIFY_ON_NEW=true

# Runtime
CURRENT_MOOD=neutral

# Search (RAG)
REHYDRATE_MAX_SIZE=51200   # bytes (default 50KB, max 1MB = 1048576)
COMPRESSION_THRESHOLD=5120  # bytes trigger for compression hint
RAG_LIMIT_MAX=20          # max results from LTC search